apiVersion: v1
kind: Namespace
metadata:
  name: integration-hub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-config
  namespace: integration-hub
data:
  HUB_JWT_SECRET: hub-dev-secret-change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-api
  namespace: integration-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: process-api
  template:
    metadata:
      labels:
        app: process-api
    spec:
      containers:
        - name: process-api
          image: integration-hub:2.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: hub-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: process-api
  namespace: integration-hub
spec:
  selector:
    app: process-api
  ports:
    - port: 80
      targetPort: 8080

name: build-api

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build ASP.NET API
        run: dotnet build api/IntegrationHub.Api.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ingest job
        run: |
          pip install pandas
          python spark-pipeline/jobs/ingest_feeds.py --pandas
